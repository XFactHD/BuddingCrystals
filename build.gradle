plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.80'
}

version = mod_version
group = 'xfacthd.buddingcrystals'

base {
    archivesName = 'BuddingCrystals'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neoforge_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        configureEach {
            // Recommended logging data for a userdev environment
            //systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'terminal.ansi', 'true'

            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
            gameDirectory = project.file('run')
        }

        server {
            server()
            gameDirectory = project.file('run_server')
            programArgument '--nogui'
        }

        data {
            data()
            gameDirectory = project.file('run')

            programArguments.addAll(
                    '--mod', 'buddingcrystals',
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath(),
                    '--existing-mod', 'ae2',
                    '--existing-mod', 'mekanism'
            )
        }
    }

    mods {
        buddingcrystals {
            sourceSet(project.sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        url "https://www.cursemaven.com"
    }
}

dependencies {
    //runtimeOnly("curse.maven:jei-238222:4595492")

    // Dynamic Asset Generator
    implementation("dev.lukebemish:dynamicassetgenerator:${dynassetgen_version}") {
        capabilities {
            requireCapability('dev.lukebemish:dynamicassetgenerator-neoforge')
        }
    }

    // Compat mods
    //runtimeOnly("curse.maven:ae2-223794:5729094")
    //runtimeOnly("curse.maven:mekanism-268560:5680395")
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version: neoforge_version,
            neo_version_range: neoforge_version_range,
            loader_version_range: loader_version_range,
            mod_version: mod_version,
            dynassetgen_version: dynassetgen_version
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
